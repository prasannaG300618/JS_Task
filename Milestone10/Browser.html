<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
</head>
<body class="bg-info d-flex justify-content-center flex-column align-items-center">
    <button onclick="Previous()" id="Previous" class="w-100 btn bg-primary m-2 text-white rounded border ">Previous page</button>
    <button onclick="get_URL()" id="URL" class="w-100 btn bg-primary m-2 text-white rounded border" >Get URL details</button>
    <button onclick="get_Det()" id="Browser" class=" w-100 btn bg-primary m-2 text-white rounded border">Get Browser Details</button>
    <button onclick="Get_Date()" id="Browser" class=" w-100 btn bg-primary m-2 text-white rounded border">Get Date</button>
    <div id="op"></div>
</body>
<script>
    let op = document.getElementById("op")
    function Previous(){
        history.back()
    }
    function get_URL(){
        op.innerHTML = window.location.href
    }
    function get_Det(){
        op.innerHTML = navigator.userAgent
    }
    function Get_Date(){
        let date = new Date()
        let format = date.toLocaleString("en-US",{
            day:"numeric",
            month:"long",
            year:"numeric"
        })
        op.innerHTML = format
    }
</script>
</html>
